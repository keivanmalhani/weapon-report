name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check for non ASCII bytes
        run: |
          if LC_ALL=C grep -rnPI '[^\x09\x20-\x7e]' . \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git; then
            echo "Non ASCII bytes found."
            exit 1
          fi
